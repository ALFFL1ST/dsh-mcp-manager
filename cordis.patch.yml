# dsh-mcp-manager bundle patch: inserts the dual-face plugin row into the
# web profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over the dsh base app; activate with
# `dsh plugin --profile <name> add <npm | link: | github: spec>`.
#
# The row is a bare plugin by package name: the node half (exports ".")
# runs in the host process (/api/dsh-mcp-manager routes), and the
# `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: mcp-manager
      name: '@linxin666/dsh-mcp-manager'
